<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive About</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: radial-gradient(
          circle at 10% 20%,
          rgb(255, 37, 174) 0%,
          rgb(241, 147, 55) 53.4%,
          rgb(250, 237, 56) 99.5%
        );
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
      }

      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
      }

      .nav-menu a {
        color: white;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: center;
        transition: color 0.3s ease;
      }

      .nav-menu a:hover {
        color: #ff6b6b;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .horizontal-line {
        height: 2px;
        background-color: #333;
        margin: 5px 30px;
      }

      .bigLogo {
        display: block;
        font-size: clamp(80px, 4vw, 48px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: 40px;
      }
      .resources {
        display: block;
        font-size: clamp(30px, 2vw, 20px);
        font-weight: bold;
        text-transform: uppercase;
        margin-left: 51.5%;
      }

      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
      }

      footer a {
        text-decoration: underline;
        color: #333;
        margin: 0 clamp(10px, 2vw, 20px);
        font-size: clamp(16px, 2vw, 24px);
      }

      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">BranKey</div>
      <div class="menu-btn">☰</div>
    </header>

    <nav class="nav-menu">
      <div class="close-btn">×</div>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="horizontal-line"></div>

    <p class="bigLogo">
      BRAN<a href="keyResources.html" class="custom-link">KEY</a>
    </p>
    <p class="resources">Resources</p>

    <footer>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="keyResources.html">KEY Resources</a>
      <a href="contact.html">Contact</a>
    </footer>

    <script>
      const menuBtn = document.querySelector(".menu-btn");
      const closeBtn = document.querySelector(".close-btn");
      const navMenu = document.querySelector(".nav-menu");
      const navLinks = document.querySelectorAll(".nav-link");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        navMenu.classList.remove("active");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
        });
      });

      function navigateTo(section) {
        document.getElementById(`${section}-link`).click();
      }
    </script>
  </body>
</html>
