<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: linear-gradient(
          68.6deg,
          rgb(252, 165, 241) 1.8%,
          rgb(181, 255, 255) 100.5%
        );
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
        text-decoration: none;
        color: black;
        -webkit-text-fill-color: black;
        -webkit-text-stroke: 1px black;
        transition: all 0.3s ease;
      }
      .logo:hover {
        background-color: transparent;
        cursor: pointer;
      }
      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
        background: linear-gradient(
          109.6deg,
          rgb(255, 78, 80) 11.2%,
          rgb(249, 212, 35) 100.2%
        );
      }

      .nav-menu a {
        color: black;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: left;
        transition: color 0.3s ease;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-decoration: underline;
      }

      .nav-menu a:hover {
        color: #3405aab4;
      }

      .close-btn {
        position: absolute;
        top: 55px;
        right: 55px;
        color: black;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 1fr 1px 1fr;
        grid-template-rows: auto;
        gap: 20px;
        margin: 0;
        width: 100%;
      }

      .grid-content {
        padding: 20px;
      }

      .grid-heading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: auto;
        color: black;
        font-size: clamp(24px, 3vw, 36px);
        text-transform: uppercase;
        font-weight: bold;
        flex-direction: column;
        text-align: center;
      }

      .learn-more-btn {
        margin-top: 10px;
        padding: 10px;
        background-color: transparent;
        color: black;
        border: 1px solid black;
        border-radius: 3px;
        cursor: pointer;
        text-align: center;
        font-size: calc(12px + 0.5vw);
        font-family: Arial, Helvetica, sans-serif;
        text-decoration: none;
      }

      .learn-more-btn:hover {
        background: pink;
        color: black;
        border: 1px solid black;
        text-decoration: none;
      }

      .horizontal-line {
        height: 1px;
        background-color: #333;
        margin: 5px 20px;
      }

      .vertical-line {
        width: 1px;
        height: 80%;
        background-color: #333;
        margin: 0 auto;
      }

      @media (max-width: 768px) {
        .grid-container {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          gap: 20px;
        }

        .vertical-line {
          display: none;
        }

        .horizontal-line {
          display: none;
        }

        .grid-heading {
          margin: 20px 0;
          padding: 30px 20px;
          position: relative;
        }

        .grid-heading::after {
          content: "";
          display: block;
          width: 100%;
          height: 3px;
          background-color: #333;
          margin: 20px 0;
        }

        .grid-heading:last-child::after {
          display: none;
        }

        footer {
          text-align: center;
        }

        footer a {
          font-size: 16px;
        }
        .grid-heading h1 {
          font-size: clamp(
            20px,
            6vw,
            32px
          ); /* Smaller font size for smaller screens */
        }

        .grid-heading h2 {
          font-size: clamp(18px, 5vw, 28px); /* Adjust for smaller devices */
        }

        .grid-heading h3 {
          font-size: clamp(16px, 4vw, 24px);
        }

        .grid-heading h4 {
          font-size: clamp(14px, 3vw, 20px);
        }
      }

      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
        width: 100%;
      }

      footer a {
        text-decoration: underline;
        color: black;
        margin: 0 clamp(10px, 2vw, 20px);
        font-size: clamp(10px, 1.5vw, 20px);
      }
      .main-content {
        flex: 1;
        padding: clamp(20px, 3vw, 40px);
      }
      .bigLogo {
        display: block;
        font-size: clamp(80px, 4vw, 48px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: 40px;
      }
      .resources {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(26px, 2vw, 20px);
        font-weight: bold;
        text-transform: uppercase;
        text-align: center;
        margin: clamp(20px, 1vw, 20px) 0;
        padding-top: 10px;
      }
      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0 transparent, -1px +1 px + 0 transparent,
          +1 px -1 px + 0 transparent, -1 px -1 px + 0 transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: white;
      }

      h1,
      h2,
      h3,
      h4 {
        text-transform: uppercase;
        font-weight: bold;
        color: black;
        -webkit-text-stroke: 1px black;
        padding-left: 0px;
        font-size: clamp(50px, 10vw, 36px);
        text-align: left;
        margin: 0;
      }
      .word1 {
        color: black;
      }

      .word2 {
        color: white;
      }

      .word3 {
        color: black;
      }

      .word4 {
        color: black;
      }

      .word5 {
        color: white;
      }
      .grid-heading h1,
      .grid-heading h2,
      .grid-heading h3,
      .grid-heading h4 {
        text-transform: uppercase;
        font-weight: bold;
        color: black;
        -webkit-text-stroke: 1px black;
        padding: 20px;
        margin: 0;
        font-size: clamp(24px, 5vw, 36px);
        text-align: left;
      }
      .rotating-text {
        position: relative;
        height: 1.2em;
        margin-left: 10px;
        width: 60px;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .rotating-text span {
        position: absolute;
        left: 0;
        opacity: 0;
        animation: rotate 4s infinite;
      }

      .rotating-text span:nth-child(1) {
        animation-delay: 0s;
      }

      .rotating-text span:nth-child(2) {
        animation-delay: 2s;
      }

      @keyframes rotate {
        0%,
        45% {
          opacity: 1;
          transform: translateY(0);
        }
        50%,
        95% {
          opacity: 0;
          transform: translateY(-20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .back-button {
        position: fixed;
        left: -40px; /* Start hidden */
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 0 5px 5px 0;
        cursor: pointer;
        transition: left 0.3s ease;
        z-index: 999;
        border: none;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .back-button:hover {
        background: rgba(0, 0, 0, 0.9);
      }

      /* Create a hover area on the left side of the screen */
      .back-hover-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 50px;
        height: 100%;
        z-index: 998;
      }

      /* Show the button when hovering over the area */
      .back-hover-area:hover + .back-button,
      .back-button:hover {
        left: 0;
      }
      @media screen and (max-width: 768px) {
        .bigLogo {
          font-size: clamp(
            40px,
            8vw,
            60px
          ); /* Smaller base size, larger viewport scaling */
        }
      }

      @media screen and (max-width: 480px) {
        .bigLogo {
          font-size: clamp(30px, 10vw, 40px); /* Even smaller for phone sizes */
          margin: 10px 0;
          padding-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="back-hover-area"></div>
    <button onclick="history.back()" class="back-button">←</button>
    <header>
      <a href="index.html" class="logo">BranKey</a>
      <div class="menu-btn">☰</div>
    </header>

    <nav class="nav-menu">
      <div class="close-btn">×</div>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Training</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="horizontal-line"></div>
    <main class="main-content">
      <div class="grid-container">
        <!-- Systemic Coaching -->
        <div class="grid-heading">
          <div class="grid-content">
            <h1>Systemic<br />Coaching</h1>
            <a href="systemicCoaching.html" class="learn-more-btn"
              >Learn More</a
            >
            <!-- Learn More button -->
          </div>
        </div>
        <div class="vertical-line"></div>

        <!-- Leadership Training -->
        <div class="grid-heading">
          <div class="grid-content">
            <h2>Leadership<br />Training</h2>
            <a href="leadershipTraining.html" class="learn-more-btn"
              >Learn More</a
            >
            <!-- Learn More button -->
          </div>
        </div>
        <div class="horizontal-line"></div>
        <div class="vertical-line"></div>
        <div class="horizontal-line"></div>

        <!-- Community Engagement -->
        <div class="grid-heading">
          <div class="grid-content">
            <h3>Community<br />Engagement</h3>
            <a href="communityEngagement.html" class="learn-more-btn"
              >Learn More</a
            >
            <!-- Learn More button -->
          </div>
        </div>
        <div class="vertical-line"></div>

        <div class="grid-heading">
          <div class="grid-content">
            <h4>
              <span class="word1">Design</span><br />
              &nbsp;&nbsp;&nbsp;<span class="word2">Create</span><br />
              &nbsp;&nbsp;&nbsp;&nbsp;<span class="word3">Build</span><br />
              <span class="word4">Share</span><br />
              &nbsp;&nbsp;&nbsp;&nbsp;<span class="word5">Connect</span>
            </h4>
          </div>
        </div>
      </div>

      <div class="horizontal-line"></div>

      <p class="bigLogo">
        BRAN<a href="keyResources.html" class="custom-link">KEY</a>
      </p>
      <p class="resources">
        Resources:
        <span class="rotating-text">
          <span>Click</span>
          <span>KEY</span>
        </span>
      </p>
    </main>
    <footer>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Training</a>
      <a href="keyResources.html">KEY Resources</a>
      <a href="contact.html">Contact</a>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const navMenu = document.querySelector(".nav-menu");
        const menuToggle = document.querySelector(".menu-btn");
        const closeBtn = document.querySelector(".close-btn");

        const toggleMenu = () => navMenu.classList.toggle("active");

        menuToggle.addEventListener("click", toggleMenu);
        closeBtn.addEventListener("click", toggleMenu);

        navMenu.addEventListener("click", (e) => {
          if (e.target.classList.contains("nav-link")) {
            toggleMenu();
          }
        });
      });
    </script>
  </body>
</html>
