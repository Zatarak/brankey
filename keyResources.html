<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Resources</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: linear-gradient(
          121.7deg,
          rgb(41, 116, 250) 22.9%,
          rgb(67, 212, 255) 69%
        );
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
        text-decoration: none;
        color: black;
        -webkit-text-fill-color: black;
        -webkit-text-stroke: 1px black;
        transition: all 0.3s ease;
      }
      .logo:hover {
        background-color: transparent;
        cursor: pointer;
      }
      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
        background: linear-gradient(
          109.6deg,
          rgb(255, 78, 80) 11.2%,
          rgb(249, 212, 35) 100.2%
        );
      }

      .nav-menu a {
        color: black;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: left;
        transition: color 0.3s ease;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      }

      .nav-menu a:hover {
        color: #3405aab4;
      }

      .close-btn {
        position: absolute;
        top: 55px;
        right: 55px;
        color: black;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .horizontal-line {
        height: 2px;
        background-color: #333;
        margin: 5px 30px;
      }
      .main-content {
        flex: 1;
        padding: clamp(20px, 3vw, 40px);
      }
      .bigLogo {
        display: block;
        font-size: clamp(80px, 4vw, 48px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: 40px;
      }
      .resources {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(26px, 2vw, 20px);
        font-weight: bold;
        text-transform: uppercase;
        text-align: center;
        margin: clamp(20px, 1vw, 20px) 0;
        padding-top: 10px;
      }

      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
      }

      footer a {
        text-decoration: underline;
        color: black;
        margin: 0 clamp(7px, 1vw, 20px);
        font-size: clamp(10px, 1.5vw, 20px);
        font-family: monospace;
      }

      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: white;
      }

      .circles-container {
        position: relative;
        height: 60vh;
        margin: 20px auto;
        width: 90%;
      }

      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.5);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease, background-color 0.3s ease;
        opacity: 0.3;
        pointer-events: none;
        animation: pulse 2s infinite ease-in-out;
        text-decoration: none;
        color: #333;
      }

      .circle.active {
        opacity: 1;
        pointer-events: auto;
      }

      .circle:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.5);
      }

      .circle h3 {
        color: #333;
        font-size: 0.9em;
        opacity: 1;
        transition: opacity 0.3s ease;
        text-align: center;
        font-family: monospace;
      }

      .circle.active:hover h3 {
        opacity: 1;
      }

      #circle1 {
        width: 150px;
        height: 150px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0s;
      }
      #circle2 {
        width: 100px;
        height: 100px;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0.2s;
      }
      #circle3 {
        width: 80px;
        height: 80px;
        top: 20%;
        left: 65%;
        transform: translate(-50%, -50%);
        animation-delay: 0.4s;
      }
      #circle4 {
        width: 100px;
        height: 100px;
        top: 70%;
        left: 65%;
        transform: translate(-50%, -50%);
        animation-delay: 0.6s;
      }
      #circle5 {
        width: 80px;
        height: 80px;
        top: 85%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0.8s;
      }
      #circle6 {
        width: 60px;
        height: 60px;
        top: 77%;
        left: 35%;
        transform: translate(-50%, -50%);
        animation-delay: 1s;
      }
      #circle7 {
        width: 80px;
        height: 80px;
        top: 50%;
        left: 35%;
        transform: translate(-50%, -50%);
        animation-delay: 1.2s;
      }
      #circle8 {
        width: 60px;
        height: 60px;
        top: 35%;
        left: 40%;
        transform: translate(-50%, -50%);
        animation-delay: 1.4s;
      }
      #circle9 {
        width: 100px;
        height: 100px;
        top: 50%;
        left: 65%;
        transform: translate(-50%, -50%);
        animation-delay: 1.6s;
      }
      #circle10 {
        width: 60px;
        height: 60px;
        top: 60%;
        left: 45%;
        transform: translate(-50%, -50%);
        animation-delay: 1.8s;
      }
      #circle11 {
        width: 60px;
        height: 60px;
        top: 65%;
        left: 30%;
        transform: translate(-50%, -50%);
        animation-delay: 1.8s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        .circles-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: auto;
        }

        .circle {
          position: static;
          margin: 10px 0;
          animation: pulse 2s infinite ease-in-out;
          opacity: 1;
          pointer-events: auto;
        }

        .circle h3 {
          text-align: center;
        }
        .resources {
          font-size: 16px;
        }
      }
      .rotating-text {
        position: relative;
        height: 1.2em;
        margin-left: 10px;
        width: 60px;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .rotating-text span {
        position: absolute;
        left: 0;
        opacity: 0;
        animation: rotate 4s infinite;
      }

      .rotating-text span:nth-child(1) {
        animation-delay: 0s;
      }

      .rotating-text span:nth-child(2) {
        animation-delay: 2s;
      }

      @keyframes rotate {
        0%,
        45% {
          opacity: 1;
          transform: translateY(0);
        }
        50%,
        95% {
          opacity: 0;
          transform: translateY(-20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .back-button {
        position: fixed;
        left: -40px; /* Start hidden */
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 0 5px 5px 0;
        cursor: pointer;
        transition: left 0.3s ease;
        z-index: 999;
        border: none;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .back-button:hover {
        background: rgba(0, 0, 0, 0.9);
      }

      /* Create a hover area on the left side of the screen */
      .back-hover-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 50px;
        height: 100%;
        z-index: 998;
      }

      /* Show the button when hovering over the area */
      .back-hover-area:hover + .back-button,
      .back-button:hover {
        left: 0;
      }
      @media screen and (max-width: 768px) {
        .bigLogo {
          font-size: clamp(
            40px,
            8vw,
            60px
          ); /* Smaller base size, larger viewport scaling */
        }
      }

      @media screen and (max-width: 480px) {
        .bigLogo {
          font-size: clamp(30px, 10vw, 40px); /* Even smaller for phone sizes */
          margin: 10px 0;
          padding-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="back-hover-area"></div>
    <button onclick="history.back()" class="back-button">←</button>
    <header>
      <a href="index.html" class="logo">BranKey</a>
      <div class="menu-btn">☰</div>
    </header>

    <nav class="nav-menu">
      <div class="close-btn">×</div>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Training</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="horizontal-line"></div>
    <main class="main-content">
      <div class="circles-container">
        <a href="systems.html" id="circle1" class="circle">
          <h3>Systems</h3>
        </a>
        <a href="belonging.html" id="circle2" class="circle">
          <h3>Belonging</h3>
        </a>
        <a href="co-being.html" id="circle3" class="circle">
          <h3>Co-Being</h3>
        </a>
        <a href="needs.html" id="circle4" class="circle">
          <h3>Needs</h3>
        </a>
        <a href="responsibility.html" id="circle5" class="circle">
          <h3>Respons<br />bility</h3>
        </a>
        <a href="communication.html" id="circle6" class="circle">
          <h3>Communi<br />cation</h3>
        </a>
        <a href="relationships.html" id="circle7" class="circle">
          <h3>Relation<br />ships</h3>
        </a>
        <a href="love.html" id="circle8" class="circle">
          <h3>Love</h3>
        </a>
        <a href="curiosity.html" id="circle9" class="circle">
          <h3>Curiosity</h3>
        </a>
        <a href="resilience.html" id="circle10" class="circle">
          <h3>Re<br />silience</h3>
        </a>
        <a href="create.html" id="circle11" class="circle">
          <h3>Create</h3>
        </a>
      </div>

      <p class="bigLogo">
        BRAN<a href="keyResources.html" class="custom-link">KEY</a>
      </p>
      <p class="resources">
        Resources:
        <span class="rotating-text">
          <span>Click</span>
          <span>KEY</span>
        </span>
      </p>
    </main>
    <footer>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Training</a>
      <a href="keyResources.html">KEY Resources</a>
      <a href="contact.html">Contact</a>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const navMenu = document.querySelector(".nav-menu");
        const menuToggle = document.querySelector(".menu-btn");
        const closeBtn = document.querySelector(".close-btn");

        const toggleMenu = () => navMenu.classList.toggle("active");

        menuToggle.addEventListener("click", toggleMenu);
        closeBtn.addEventListener("click", toggleMenu);

        navMenu.addEventListener("click", (e) => {
          if (e.target.classList.contains("nav-link")) {
            toggleMenu();
          }
        });
      });

      // Circle animation
      document.querySelectorAll(".circle").forEach((circle) => {
        setTimeout(() => {
          circle.classList.add("active");
        }, 500 * parseInt(circle.id.replace("circle", "")));
      });
    </script>
  </body>
</html>
