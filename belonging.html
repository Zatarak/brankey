<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Systemic Coaching</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: white;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
        text-decoration: none;
        color: black;
        -webkit-text-fill-color: black;
        -webkit-text-stroke: 1px black;
        transition: all 0.3s ease;
      }
      .logo:hover {
        background-color: transparent;
        cursor: pointer;
      }
      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
        background: linear-gradient(
          109.6deg,
          rgb(255, 78, 80) 11.2%,
          rgb(249, 212, 35) 100.2%
        );
      }

      .nav-menu a {
        color: black;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: left;
        transition: color 0.3s ease;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-decoration: underline;
      }

      .nav-menu a:hover {
        color: #3405aab4;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .horizontal-line {
        height: 2px;
        background-color: #333;
        margin: 5px 30px;
      }
      .main-content {
        flex: 1;
        padding: clamp(20px, 3vw, 40px);
      }
      .bigLogo {
        display: block;
        font-size: clamp(40px, 8vw, 80px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: clamp(20px, 4vw, 40px);
      }
      .resources {
        display: block;
        font-size: clamp(30px, 2vw, 20px);
        font-weight: bold;
        text-transform: uppercase;
        text-align: left;
        margin-left: 51.5%;
      }
      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
      }

      footer a {
        text-decoration: underline;
        color: black;
        margin: 0 clamp(10px, 2vw, 20px);
        font-size: clamp(10px, 1.5vw, 20px);
      }

      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: rgb(92, 121, 255);
      }
      .action-button {
        padding: 10px;
        margin-left: 5vw;
        margin-top: 0px;
        width: 30%;
        font-size: clamp(16px, 3vw, 24px);
        font-family: monospace;
        text-align: center;
        color: white;
        background-color: rgb(92, 121, 255);
        border: 2px solid black;
        border-radius: 3px;
        cursor: pointer;
        text-align: center;
        display: inline-block;
        text-transform: uppercase;
        text-decoration: none;
      }

      .action-button:hover {
        background: black;
        color: rgb(92, 121, 255);
        border: 2px solid black;
        text-decoration: none;
      }

      .belongingText {
        padding: 25px;
        margin: 10px;
        font-size: clamp(13px, 2.5vw, 24px);
        font-family: "Courier New", Courier, monospace;
        text-align: justify;
        color: black;
        line-height: 1.5;
      }
      h1 {
        padding: 20px;
        margin: 20px;
        font-size: clamp(40px, 6vw, 24px);
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-align: left;
        color: black;
        text-align: center;
      }
      .box {
        width: 90%;
        padding: 5px;
        margin-left: 5vw;
        margin-right: 5vw;
        border: 2px solid black;
        margin-bottom: 10px;
      }

      @media (max-width: 768px) {
        .box {
          width: 95%; /* Increase width on small screens */
          margin-left: 2vw; /* Adjust margin to be responsive */
          margin-right: 2vw;
        }
        .resources {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">BranKey</a>
      <div class="menu-btn">☰</div>
    </header>

    <nav class="nav-menu">
      <div class="close-btn">×</div>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="horizontal-line"></div>
    <main class="main-content">
      <div class="box">
        <h1><span class="highlight">Belonging</span></h1>
        <p class="belongingText"></p>
      </div>
      <a href="#" class="action-button">Explore Your Belonging</a>
      <div id="belonging-circles"></div>
      <p class="bigLogo">
        BRAN<a href="keyResources.html" class="custom-link">KEY</a>
      </p>
      <p class="resources">Resources</p>
    </main>
    <footer>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </footer>

    <script>
      const menuBtn = document.querySelector(".menu-btn");
      const closeBtn = document.querySelector(".close-btn");
      const navMenu = document.querySelector(".nav-menu");
      const navLinks = document.querySelectorAll(".nav-link");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        navMenu.classList.remove("active");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
        });
      });

      function navigateTo(section) {
        document.getElementById(`${section}-link`).click();
      }
      import React, { useState, useRef, useEffect } from "react";
      import { X, Plus } from "lucide-react";

      const BelongingCircles = () => {
        const [items, setItems] = useState({
          inner: [
            { id: "1", category: "People", text: "Family" },
            { id: "2", category: "Places", text: "Home" },
            { id: "3", category: "Activities", text: "Hobbies" },
          ],
          middle: [
            { id: "4", category: "People", text: "Colleagues" },
            { id: "5", category: "Places", text: "Workplace" },
            { id: "6", category: "Activities", text: "Social Media" },
          ],
          outer: [
            { id: "7", category: "People", text: "New Acquaintances" },
            { id: "8", category: "Places", text: "New City" },
            { id: "9", category: "Activities", text: "New Hobby" },
          ],
        });

        const [newItem, setNewItem] = useState("");
        const [selectedCategory, setSelectedCategory] = useState("People");
        const [draggingItem, setDraggingItem] = useState(null);
        const [showForm, setShowForm] = useState(false);

        const categories = ["People", "Places", "Activities", "Values"];
        const circles = ["inner", "middle", "outer"];
        const colors = {
          People: "#4F46E5",
          Places: "#059669",
          Activities: "#DC2626",
          Values: "#D97706",
        };

        const handleDragStart = (item, circle) => {
          setDraggingItem({ item, sourceCircle: circle });
        };

        const handleDrop = (targetCircle) => {
          if (!draggingItem) return;

          const { item, sourceCircle } = draggingItem;
          if (sourceCircle === targetCircle) return;

          setItems((prev) => ({
            ...prev,
            [sourceCircle]: prev[sourceCircle].filter((i) => i.id !== item.id),
            [targetCircle]: [...prev[targetCircle], item],
          }));
          setDraggingItem(null);
        };

        const handleAddItem = (e) => {
          e.preventDefault();
          if (!newItem.trim()) return;

          const newId = Math.random().toString(36).substr(2, 9);
          setItems((prev) => ({
            ...prev,
            outer: [
              ...prev.outer,
              {
                id: newId,
                category: selectedCategory,
                text: newItem.trim(),
              },
            ],
          }));
          setNewItem("");
          setShowForm(false);
        };

        const handleRemoveItem = (itemId, circle) => {
          setItems((prev) => ({
            ...prev,
            [circle]: prev[circle].filter((item) => item.id !== itemId),
          }));
        };

        return (
          <div className="w-full max-w-3xl mx-auto p-4 font-mono">
            <h2 className="text-2xl font-bold mb-4 text-center">
              Map Your Circles of Belonging
            </h2>

            <div className="relative h-[500px] bg-gray-50 rounded-lg mb-4">
              {circles.map((circle, idx) => (
                <div
                  key={circle}
                  className={`absolute rounded-full border-2 border-gray-300 transition-colors
              ${
                idx === 0
                  ? "w-[200px] h-[200px]"
                  : idx === 1
                  ? "w-[350px] h-[350px]"
                  : "w-[500px] h-[500px]"
              }
              ${draggingItem && "hover:border-blue-500"}`}
                  style={{
                    top: "50%",
                    left: "50%",
                    transform: "translate(-50%, -50%)",
                  }}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={() => handleDrop(circle)}
                >
                  <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 text-sm font-bold">
                    {circle.charAt(0).toUpperCase() + circle.slice(1)}
                  </div>

                  {items[circle].map((item) => (
                    <div
                      key={item.id}
                      draggable
                      onDragStart={() => handleDragStart(item, circle)}
                      className="absolute cursor-move bg-white px-3 py-1 rounded-full shadow-sm
                  transform -translate-x-1/2 -translate-y-1/2 flex items-center gap-2"
                      style={{
                        top: `${Math.random() * 70 + 15}%`,
                        left: `${Math.random() * 70 + 15}%`,
                        borderLeft: `4px solid ${colors[item.category]}`,
                      }}
                    >
                      {item.text}
                      <button
                        onClick={() => handleRemoveItem(item.id, circle)}
                        className="text-gray-400 hover:text-red-500"
                      >
                        <X size={14} />
                      </button>
                    </div>
                  ))}
                </div>
              ))}

              <button
                onClick={() => setShowForm(true)}
                className="absolute bottom-4 right-4 bg-blue-500 text-white p-2 rounded-full hover:bg-blue-600"
              >
                <Plus size={24} />
              </button>
            </div>

            {showForm && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                <form
                  onSubmit={handleAddItem}
                  className="bg-white p-6 rounded-lg max-w-md w-full"
                >
                  <h3 className="text-lg font-bold mb-4">Add New Item</h3>

                  <div className="mb-4">
                    <label className="block text-sm font-medium mb-1">
                      Category
                    </label>
                    <select
                      value={selectedCategory}
                      onChange={(e) => setSelectedCategory(e.target.value)}
                      className="w-full border rounded p-2"
                    >
                      {categories.map((category) => (
                        <option key={category} value={category}>
                          {category}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="mb-4">
                    <label className="block text-sm font-medium mb-1">
                      Text
                    </label>
                    <input
                      type="text"
                      value={newItem}
                      onChange={(e) => setNewItem(e.target.value)}
                      className="w-full border rounded p-2"
                      placeholder="Enter text..."
                    />
                  </div>

                  <div className="flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowForm(false)}
                      className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                    >
                      Add
                    </button>
                  </div>
                </form>
              </div>
            )}

            <div className="mt-4 p-4 bg-gray-50 rounded-lg">
              <h3 className="font-bold mb-2">How to use:</h3>
              <ul className="list-disc pl-5 space-y-1 text-sm">
                <li>
                  Drag items between circles to show how connected you feel to
                  them
                </li>
                <li>Add new items using the + button</li>
                <li>Different colors represent different categories</li>
                <li>
                  Inner circle = Most connected, Outer circle = Less connected
                </li>
              </ul>
            </div>
          </div>
        );
      };

      export default BelongingCircles;
    </script>
  </body>
</html>
