<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: linear-gradient(
          68.6deg,
          rgb(252, 165, 241) 1.8%,
          rgb(181, 255, 255) 100.5%
        );
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
      }

      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
      }

      .nav-menu a {
        color: white;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: center;
        transition: color 0.3s ease;
      }

      .nav-menu a:hover {
        color: #ff6b6b;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 1fr 1px 1fr;
        grid-template-rows: auto; /* Changed to auto to allow wrapping */
        gap: 20px;
        margin: 30px;
      }

      .grid-content {
        padding: 20px;
      }

      .grid-heading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: auto;
        color: transparent;
        -webkit-text-stroke: 1px black;
        font-size: clamp(24px, 3vw, 36px);
        text-transform: uppercase;
        font-weight: bold;
        flex-direction: column; /* Added to stack button below heading */
        text-align: center; /* Center align heading */
      }

      .learn-more-btn {
        margin-top: 10px;
        padding: 10px;
        background-color: transparent;
        color: black;
        border: 1px solid black;
        border-radius: 3px;
        cursor: pointer;
        text-align: center;
        font-size: 13px;
        font-family: Arial, Helvetica, sans-serif;
        text-decoration: none;
      }

      .learn-more-btn:hover {
        background: pink;
        color: black;
        border: 1px solid black;
        text-decoration: none;
      }

      .horizontal-line {
        height: 1px;
        background-color: #333;
        margin: 20px 20px;
      }

      .vertical-line {
        width: 1px;
        height: 80%;
        background-color: #333;
        margin: 0 auto;
      }

      @media (max-width: 768px) {
        .grid-container {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          gap: 20px;
        }

        .vertical-line {
          display: none;
        }

        .horizontal-line {
          display: none;
        }

        .grid-heading {
          margin: 20px 0;
          padding: 30px 20px;
          position: relative;
        }

        .grid-heading::after {
          content: "";
          display: block;
          width: 100%;
          height: 3px;
          background-color: #333;
          margin: 20px 0;
        }

        .grid-heading:last-child::after {
          display: none;
        }
      }

      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
      }

      footer a {
        text-decoration: underline;
        color: #333;
        margin: 0 clamp(10px, 2vw, 20px);
        font-size: clamp(16px, 2vw, 24px);
      }

      .bigLogo {
        display: block;
        font-size: clamp(80px, 4vw, 48px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: 40px;
      }

      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0 transparent, -1px +1 px + 0 transparent,
          +1 px -1 px + 0 transparent, -1 px -1 px + 0 transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: white;
      }

      h1,
      h2,
      h3,
      h4 {
        text-transform: uppercase;
        font-weight: bold;
        color: transparent;
        -webkit-text-stroke: 1px black;
        padding: 20px;
        font-size: clamp(50px, 10vw, 36px);
        text-align: left;
      }
    </style>
  </head>

    <script>
      const menuBtn = document.querySelector(".menu-btn");
      const closeBtn = document.querySelector(".close-btn");
      const navMenu = document.querySelector(".nav-menu");
      const navLinks = document.querySelectorAll(".nav-link");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        navMenu.classList.remove("active");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
        });
      });
    </script>
