<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Resources</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: linear-gradient(
          121.7deg,
          rgb(41, 116, 250) 22.9%,
          rgb(67, 212, 255) 69%
        );
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
        text-decoration: none;
        color: black;
        -webkit-text-fill-color: black;
        -webkit-text-stroke: 1px black;
        transition: all 0.3s ease;
      }

      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
        background: linear-gradient(
          109.6deg,
          rgb(255, 78, 80) 11.2%,
          rgb(249, 212, 35) 100.2%
        );
      }

      .nav-menu a {
        color: black;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: left;
        transition: color 0.3s ease;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-decoration: underline;
      }

      .nav-menu a:hover {
        color: #3405aab4;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .horizontal-line {
        height: 2px;
        background-color: #333;
        margin: 5px 30px;
      }
      .main-content {
        flex: 1;
        padding: clamp(20px, 3vw, 40px);
      }
      .bigLogo {
        display: block;
        font-size: clamp(40px, 8vw, 80px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: clamp(20px, 4vw, 40px);
      }
      .resources {
        display: block;
        font-size: clamp(30px, 2vw, 20px);
        font-weight: bold;
        text-transform: uppercase;
        text-align: left;
        margin-left: 51.5%;
      }
      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
      }

      footer a {
        text-decoration: underline;
        color: black;
        margin: 0 clamp(10px, 2vw, 20px);
        font-size: clamp(10px, 1.5vw, 20px);
      }

      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: white;
      }

      .circles-container {
        position: relative;
        height: 60vh;
        margin: 20px auto;
        width: 90%;
      }

      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.5);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease, background-color 0.3s ease;
        opacity: 0.3;
        pointer-events: none;
        animation: pulse 2s infinite ease-in-out;
      }

      .circle.active {
        opacity: 1;
        pointer-events: auto;
      }

      .circle:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.5);
      }

      .circle h3 {
        color: #333;
        font-size: 0.9em;
        opacity: 1;
        transition: opacity 0.3s ease;
        text-align: center;
        font-family: monospace;
      }

      .circle.active:hover h3 {
        opacity: 1;
      }

      #circle1 {
        width: 150px;
        height: 150px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0s;
      }
      #circle2 {
        width: 100px;
        height: 100px;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0.2s;
      }
      #circle3 {
        width: 80px;
        height: 80px;
        top: 20%;
        left: 65%;
        transform: translate(-50%, -50%);
        animation-delay: 0.4s;
      }
      #circle4 {
        width: 100px;
        height: 100px;
        top: 70%;
        left: 65%;
        transform: translate(-50%, -50%);
        animation-delay: 0.6s;
      }
      #circle5 {
        width: 80px;
        height: 80px;
        top: 85%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0.8s;
      }
      #circle6 {
        width: 60px;
        height: 60px;
        top: 77%;
        left: 35%;
        transform: translate(-50%, -50%);
        animation-delay: 1s;
      }
      #circle7 {
        width: 80px;
        height: 80px;
        top: 50%;
        left: 35%;
        transform: translate(-50%, -50%);
        animation-delay: 1.2s;
      }
      #circle8 {
        width: 60px;
        height: 60px;
        top: 35%;
        left: 40%;
        transform: translate(-50%, -50%);
        animation-delay: 1.4s;
      }
      #circle9 {
        width: 100px;
        height: 100px;
        top: 50%;
        left: 65%;
        transform: translate(-50%, -50%);
        animation-delay: 1.6s;
      }
      #circle10 {
        width: 60px;
        height: 60px;
        top: 60%;
        left: 45%;
        transform: translate(-50%, -50%);
        animation-delay: 1.8s;
      }
      #circle11 {
        width: 60px;
        height: 60px;
        top: 65%;
        left: 30%;
        transform: translate(-50%, -50%);
        animation-delay: 1.8s;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1100;
      }

      .modal-content {
        position: relative;
        background: white;
        width: 80%;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        border-radius: 10px;
        animation: modalFade 0.3s ease-in;
        max-height: 80vh;
        overflow-y: auto;
      }

      .close-modal {
        position: absolute;
        right: 20px;
        top: 10px;
        font-size: 24px;
        cursor: pointer;
        color: #333;
        float: right;
      }

      .modal-title {
        font-size: 24px;
        margin-bottom: 15px;
        color: #333;
      }

      .modal-text {
        font-size: 16px;
        line-height: 1.6;
        color: #666;
        white-space: pre-wrap;
        margin-bottom: 20px;
      }
      .close-modal:hover,
      .close-modal:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      @keyframes flowline {
        from {
          stroke-dashoffset: 1000;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background-color: rgb(41, 116, 250);
        color: white;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #0056b3;
      }
      @media (max-width: 768px) {
        .circles-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: auto; /* Adjust as needed */
        }

        .circle {
          position: static;
          margin: 10px 0; /* Space between circles */
          animation: none; /* Remove animation if unnecessary for this layout */
          opacity: 1; /* Ensure visibility */
          pointer-events: auto;
        }

        .circle h3 {
          text-align: center; /* Center text within each circle */
        }
        @keyframes pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 0.8;
          }
          50% {
            transform: scale(1.2);
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">BranKey</div>
      <div class="menu-btn">☰</div>
    </header>

    <nav class="nav-menu">
      <div class="close-btn">×</div>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="horizontal-line"></div>
    <main class="main-content">
      <div class="circles-container">
        <div id="circle1" class="circle">
          <h3>Systems</h3>
        </div>
        <div id="circle2" class="circle">
          <h3>Belonging</h3>
        </div>
        <div id="circle3" class="circle"><h3>Co-Being</h3></div>
        <div id="circle4" class="circle"><h3>Needs</h3></div>
        <div id="circle5" class="circle">
          <h3>Respons<br />bility</h3>
        </div>
        <div id="circle6" class="circle">
          <h3>Communi<br />cation</h3>
        </div>
        <div id="circle7" class="circle">
          <h3>Relation<br />ships</h3>
        </div>
        <div id="circle8" class="circle"><h3>Love</h3></div>
        <div id="circle9" class="circle"><h3>Curiosity</h3></div>
        <div id="circle10" class="circle">
          <h3>Re<br />silience</h3>
        </div>
        <div id="circle11" class="circle">
          <h3>Create</h3>
        </div>
      </div>

      <div class="modal">
        <div class="modal-content">
          <span class="close-modal">&times;</span>
          <h2 class="modal-title"></h2>
          <p class="modal-text"></p>
          <div class="custom-content"></div>
        </div>
      </div>

      <p class="bigLogo">
        BRAN<a href="keyResources.html" class="custom-link">KEY</a>
      </p>
      <p class="resources">Resources</p>
    </main>
    <footer>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="keyResources.html">KEY Resources</a>
      <a href="contact.html">Contact</a>
    </footer>

    <script>
      // Menu functionality
      const menuBtn = document.querySelector(".menu-btn");
      const closeBtn = document.querySelector(".close-btn");
      const navMenu = document.querySelector(".nav-menu");
      const navLinks = document.querySelectorAll(".nav-link");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        navMenu.classList.remove("active");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
        });
      });

      // Circle and modal functionality
      const circleContent = {
        circle1: {
          title: "Systems",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book A Session</button>",
        },

        circle2: {
          title: "Belonging",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle3: {
          title: "Co-Being",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle4: {
          title: "Needs",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle5: {
          title: "Responsibility",
          text: "Change",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle6: {
          title: "Communication",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle7: {
          title: "Relationships",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle8: {
          title: "Love",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle9: {
          title: "Curiosity",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle10: {
          title: "Resilience",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
        circle11: {
          title: "Creating",
          text: "text",
          customContent:
            "<button onclick=\"navigateToPage('https://calendly.com/brankeey/30min')\">Book a Session</button>",
        },
      };

      const modal = document.querySelector(".modal");
      const modalTitle = document.querySelector(".modal-title");
      const modalText = document.querySelector(".modal-text");
      const closeModal = document.querySelector(".close-modal");

      function showModal(e) {
        const circle = e.currentTarget;
        const content = circleContent[circle.id];
        modalTitle.textContent = content.title;
        modalText.textContent = content.text;
        const existingCustomContent = modal.querySelector(".custom-content");
        if (existingCustomContent) existingCustomContent.remove();

        // Add custom content (e.g., button)
        if (content.customContent) {
          const customContentDiv = document.createElement("div");
          customContentDiv.classList.add("custom-content");
          customContentDiv.innerHTML = content.customContent;
          modalText.after(customContentDiv);
        }

        modal.style.display = "block";
      }
      function closeModalAndCleanup() {
        modal.style.display = "none";
      }
      document.querySelectorAll(".circle").forEach((circle) => {
        setTimeout(() => {
          circle.classList.add("active");
        }, 500 * parseInt(circle.id.replace("circle", "")));

        circle.addEventListener("mouseenter", () => {
          if (circle.classList.contains("active")) {
            circle.addEventListener("click", showModal);
          }
        });

        circle.addEventListener("mouseleave", () => {
          circle.removeEventListener("click", showModal);
        });
      });

      closeModal.addEventListener("click", closeModalAndCleanup);
      window.addEventListener("click", (e) => {
        if (e.target === modal) {
          closeModalAndCleanup();
        }
      });
      function navigateTo(section) {
        document.getElementById(`${section}-link`).click();
      }
      function navigateToPage(page) {
        window.location.href = page;
      }
    </script>
  </body>
</html>
