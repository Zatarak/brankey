<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Systemic Coaching</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: calc(14px + 0.390625vw);
        background: white;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(10px, 2vw, 30px);
        background-color: transparent;
        position: relative;
        z-index: 1001;
      }

      .logo {
        margin-left: clamp(10px, 2vw, 30px);
        font-weight: bold;
        font-size: clamp(30px, 3vw, 50px);
        font-family: monospace;
        text-decoration: none;
        color: black;
        -webkit-text-fill-color: black;
        -webkit-text-stroke: 1px black;
        transition: all 0.3s ease;
      }

      .menu-btn {
        margin-right: clamp(10px, 2vw, 30px);
        cursor: pointer;
        font-size: clamp(30px, 3vw, 50px);
        z-index: 1002;
      }

      .nav-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: black;
        padding: clamp(20px, 3vw, 40px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .nav-menu.active {
        display: flex;
        opacity: 1;
        visibility: visible;
        background: linear-gradient(
          109.6deg,
          rgb(255, 78, 80) 11.2%,
          rgb(249, 212, 35) 100.2%
        );
      }

      .nav-menu a {
        color: black;
        text-decoration: none;
        display: block;
        padding: clamp(15px, 2.5vw, 30px) 0;
        font-size: clamp(24px, 4vw, 48px);
        text-align: left;
        transition: color 0.3s ease;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-decoration: underline;
      }

      .nav-menu a:hover {
        color: #3405aab4;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: clamp(24px, 3vw, 36px);
        cursor: pointer;
      }

      .horizontal-line {
        height: 2px;
        background-color: #333;
        margin: 5px 30px;
      }

      .main-content {
        flex: 1;
        padding: clamp(20px, 3vw, 40px);
      }

      .bigLogo {
        display: block;
        font-size: clamp(40px, 8vw, 80px);
        margin: clamp(20px, 1vw, 20px) 0;
        font-weight: bold;
        text-align: center;
        padding-top: clamp(20px, 4vw, 40px);
      }

      .resources {
        display: block;
        font-size: clamp(30px, 2vw, 20px);
        font-weight: bold;
        text-transform: uppercase;
        text-align: left;
        margin-left: 51.5%;
      }

      footer {
        background-color: transparent;
        padding: clamp(20px, 3vw, 40px);
        text-align: center;
        margin-top: clamp(10px, 2vw, 20px);
      }

      footer a {
        text-decoration: underline;
        color: black;
        margin: 0 clamp(10px, 2vw, 20px);
        font-size: clamp(10px, 1.5vw, 20px);
      }

      .custom-link {
        text-decoration: none;
        border-bottom: 10px solid black;
        color: transparent;
        -webkit-text-stroke: 1px black;
        text-shadow: 1px 1px 0px transparent, -1px 1px 0px transparent,
          1px -1px 0px transparent, -1px -1px 0px transparent;
      }

      .custom-link:hover {
        background-color: transparent;
        color: rgb(92, 121, 255);
      }

      .action-button {
        padding: 10px;
        margin-left: 5vw;
        margin-top: 0px;
        width: 30%;
        font-size: clamp(16px, 3vw, 24px);
        font-family: monospace;
        text-align: center;
        color: white;
        background-color: rgb(92, 121, 255);
        border: 2px solid black;
        border-radius: 3px;
        cursor: pointer;
        text-align: center;
        display: inline-block;
        text-transform: uppercase;
        text-decoration: none;
      }

      .action-button:hover {
        background: black;
        color: rgb(92, 121, 255);
        border: 2px solid black;
        text-decoration: none;
      }

      .sytemsText {
        padding: 25px;
        margin: 10px;
        font-size: clamp(13px, 2.5vw, 24px);
        font-family: "Courier New", Courier, monospace;
        text-align: justify;
        color: black;
        line-height: 1.5;
      }

      h1 {
        padding: 20px;
        margin: 20px;
        font-size: clamp(40px, 6vw, 24px);
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-align: left;
        color: black;
        text-align: center;
      }

      .box {
        width: 90%;
        padding: 5px;
        margin-left: 5vw;
        margin-right: 5vw;
        border: 2px solid black;
        margin-bottom: 10px;
      }

      /* System Diagram Styles */
      .system-diagram {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
      }

      .system-svg {
        width: 100%;
        height: auto;
      }

      .system-filters {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        justify-content: center;
      }

      .filter-button {
        padding: 8px 16px;
        border-radius: 9999px;
        border: none;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .filter-button.active {
        background-color: #1e293b;
        color: white;
      }

      .filter-button:not(.active) {
        background-color: #e2e8f0;
        color: #475569;
      }

      .system-node {
        transition: all 0.3s;
        cursor: pointer;
      }

      .system-node circle {
        transition: all 0.3s;
      }

      .system-node:hover circle {
        transform: scale(1.1);
      }

      .system-connection {
        transition: all 0.2s;
        stroke: #94a3b8;
        stroke-width: 1;
      }

      .system-connection.active {
        stroke: #2563eb;
        stroke-width: 3;
      }

      .system-info-box {
        margin-top: 16px;
        padding: 16px;
        background-color: #f1f5f9;
        border-radius: 8px;
        min-height: 80px;
      }

      .physical {
        fill: #2563eb;
      }
      .psychological {
        fill: #7c3aed;
      }
      .social {
        fill: #059669;
      }
      .environmental {
        fill: #d97706;
      }

      .system-node:not(:hover) circle {
        fill: #1e293b;
      }

      @media (max-width: 768px) {
        .box {
          width: 95%;
          margin-left: 2vw;
          margin-right: 2vw;
        }
        .resources {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">BranKey</div>
      <div class="menu-btn">☰</div>
    </header>

    <nav class="nav-menu">
      <div class="close-btn">×</div>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <div class="horizontal-line"></div>
    <main class="main-content">
      <div class="box">
        <h1><span class="highlight">Systems</span></h1>

        <div class="system-diagram">
          <div class="system-filters">
            <button class="filter-button active" data-category="all">
              All
            </button>
            <button class="filter-button" data-category="physical">
              Physical
            </button>
            <button class="filter-button" data-category="psychological">
              Psychological
            </button>
            <button class="filter-button" data-category="social">Social</button>
            <button class="filter-button" data-category="environmental">
              Environmental
            </button>
          </div>

          <svg viewBox="0 0 500 500" class="system-svg">
            <g id="nodes-container"></g>
          </svg>

          <div class="system-info-box">
            <p class="info-text">
              Hover over any element to see its description and connections.
            </p>
          </div>
        </div>
      </div>
      <a href="#" class="action-button">ACTION</a>

      <p class="bigLogo">
        BRAN<a href="keyResources.html" class="custom-link">KEY</a>
      </p>
      <p class="resources">Resources</p>
    </main>

    <footer>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="keyResources.html" class="nav-link">KEY Resources</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </footer>

    <script>
      // Menu functionality
      const menuBtn = document.querySelector(".menu-btn");
      const closeBtn = document.querySelector(".close-btn");
      const navMenu = document.querySelector(".nav-menu");
      const navLinks = document.querySelectorAll(".nav-link");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        navMenu.classList.remove("active");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
        });
      });

      // System diagram functionality
      const systemData = {
        body: {
          category: "physical",
          connections: ["brain", "health", "emotions"],
          description: "Physical structure and biological processes",
        },
        brain: {
          category: "physical",
          connections: ["mind", "body", "emotions"],
          description: "Neural networks and cognitive processing",
        },
        health: {
          category: "physical",
          connections: ["body", "emotions", "environment"],
          description: "Overall physical wellbeing and vitality",
        },
        mind: {
          category: "psychological",
          connections: ["brain", "emotions", "beliefs"],
          description: "Conscious thoughts and mental processes",
        },
        emotions: {
          category: "psychological",
          connections: ["mind", "body", "relationships"],
          description: "Feelings and emotional responses",
        },
        beliefs: {
          category: "psychological",
          connections: ["mind", "culture", "behavior"],
          description: "Personal values and belief systems",
        },
        relationships: {
          category: "social",
          connections: ["emotions", "behavior", "culture"],
          description: "Connections with family, friends, and others",
        },
        culture: {
          category: "social",
          connections: ["beliefs", "relationships", "environment"],
          description: "Cultural context and social norms",
        },
        behavior: {
          category: "social",
          connections: ["beliefs", "relationships", "environment"],
          description: "Actions and interactions with others",
        },
        environment: {
          category: "environmental",
          connections: ["health", "culture", "behavior"],
          description: "Physical and social surroundings",
        },
      };

      let positions = {};

      function initializeSystemDiagram() {
        const svg = document.querySelector(".system-svg");
        const nodesContainer = document.getElementById("nodes-container");
        const infoBox = document.querySelector(".system-info-box");
        const filterButtons = document.querySelectorAll(".filter-button");

        let currentCategory = "all";
        let hoveredElement = null;

        function getPosition(index, total, radius = 150) {
          const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
          return {
            x: radius * Math.cos(angle) + 250,
            y: radius * Math.sin(angle) + 250,
          };
        }

        function updateDiagram() {
          const filteredElements = Object.entries(systemData).filter(
            ([_, data]) =>
              currentCategory === "all" || data.category === currentCategory
          );

          // Calculate positions
          positions = {};
          filteredElements.forEach(([key], index) => {
            positions[key] = getPosition(index, filteredElements.length);
          });

          // Update connections
          const connections = svg.querySelectorAll(".system-connection");
          connections.forEach((conn) => conn.remove());

          filteredElements.forEach(([element, data]) => {
            data.connections
              .filter((target) => positions[target])
              .forEach((target) => {
                const line = document.createElementNS(
                  "http://www.w3.org/2000/svg",
                  "line"
                );
                line.classList.add("system-connection");
                line.setAttribute("x1", positions[element].x);
                line.setAttribute("y1", positions[element].y);
                line.setAttribute("x2", positions[target].x);
                line.setAttribute("y2", positions[target].y);
                svg.insertBefore(line, nodesContainer);
              });
          });

          // Update nodes
          nodesContainer.innerHTML = "";
          filteredElements.forEach(([element, data]) => {
            const g = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "g"
            );
            g.classList.add("system-node");
            g.setAttribute(
              "transform",
              `translate(${positions[element].x},${positions[element].y})`
            );

            const circle = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle"
            );
            circle.setAttribute("r", "40");
            circle.classList.add(data.category);

            const text = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text"
            );
            text.textContent = element;
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("dy", "0.3em");
            text.setAttribute("fill", "white");

            g.appendChild(circle);
            g.appendChild(text);

            g.addEventListener("mouseenter", () => {
              hoveredElement = element;
              updateHighlights();
              updateInfoBox();
            });

            g.addEventListener("mouseleave", () => {
              hoveredElement = null;
              updateHighlights();
              updateInfoBox();
            });

            nodesContainer.appendChild(g);
          });
        }

        function updateHighlights() {
          const connections = svg.querySelectorAll(".system-connection");
          connections.forEach((conn) => {
            conn.classList.remove("active");
          });

          if (hoveredElement) {
            const elementData = systemData[hoveredElement];
            elementData.connections.forEach((target) => {
              connections.forEach((conn) => {
                const x1 = parseFloat(conn.getAttribute("x1"));
                const y1 = parseFloat(conn.getAttribute("y1"));
                const x2 = parseFloat(conn.getAttribute("x2"));
                const y2 = parseFloat(conn.getAttribute("y2"));

                if (
                  (x1 === positions[hoveredElement].x &&
                    y1 === positions[hoveredElement].y) ||
                  (x2 === positions[hoveredElement].x &&
                    y2 === positions[hoveredElement].y)
                ) {
                  conn.classList.add("active");
                }
              });
            });
          }
        }

        function updateInfoBox() {
          if (hoveredElement) {
            const data = systemData[hoveredElement];
            infoBox.innerHTML = `
              <p><strong class="capitalize">${hoveredElement}</strong> (${
              data.category
            }): ${data.description}</p>
              <p class="mt-2">Connected to: ${data.connections.join(", ")}</p>
            `;
          } else {
            infoBox.innerHTML = `
              <p>Hover over any element to see its description and connections.</p>
            `;
          }
        }

        filterButtons.forEach((button) => {
          button.addEventListener("click", () => {
            filterButtons.forEach((btn) => btn.classList.remove("active"));
            button.classList.add("active");
            currentCategory = button.dataset.category;
            hoveredElement = null;
            updateDiagram();
            updateInfoBox();
          });
        });

        updateDiagram();
      }

      // Initialize the system diagram when the page loads
      document.addEventListener("DOMContentLoaded", () => {
        initializeSystemDiagram();
      });
    </script>
  </body>
</html>
